services:
  app:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    working_dir: /var/www/html
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: autoparts
      DB_USERNAME: autoparts
      DB_PASSWORD: change-me
      REDIS_HOST: redis
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8000"
    volumes: [ ".:/var/www/html" ]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    networks: [autoparts]
  queue:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    working_dir: /var/www/html
    env_file: .env
    environment: { DB_HOST: postgres, DB_PORT: 5432, DB_DATABASE: autoparts, DB_USERNAME: autoparts, DB_PASSWORD: change-me, REDIS_HOST: redis }
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes: [ ".:/var/www/html" ]
    depends_on: { app: { condition: service_started } }
    networks: [autoparts]
  scheduler:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    working_dir: /var/www/html
    env_file: .env
    environment: { DB_HOST: postgres, DB_PORT: 5432, DB_DATABASE: autoparts, DB_USERNAME: autoparts, DB_PASSWORD: change-me, REDIS_HOST: redis }
    command: php artisan schedule:work
    volumes: [ ".:/var/www/html" ]
    depends_on: { app: { condition: service_started } }
    networks: [autoparts]
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8081:80"]
    volumes: ["./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
    networks: [autoparts]
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: autoparts, POSTGRES_USER: autoparts, POSTGRES_PASSWORD: change-me }
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U autoparts -d autoparts"], interval: 5s, timeout: 5s, retries: 10 }
    networks: [autoparts]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    networks: [autoparts]
networks: { autoparts: { driver: bridge } }
volumes: { postgres_data: {}, redis_data: {} }
